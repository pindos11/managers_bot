# Keep TELEGRAM_BOT_TOKEN outside this file, e.g. in the systemd EnvironmentFile.
[telegram]
owner_user_id = 123456789
group_chat_id = -1001234567890
topic_id = 42 # Telegram message_thread_id

[reporting]
timezone = "Europe/Kyiv"
daily_reset_time = "06:00"
summary_interval_minutes = 60
language = "en" # Loads progress_bot/translations/en.json; copy it to another language code to translate.
accept_all_topic_users = false # When true, accept reports from everyone in the configured chat topic.
# Card share is card / personal actions. Omit to show the percentage without a warning.
card_percent_bad_threshold = 50 # A lower percentage is marked with ⚠️ in summaries.

[storage]
database_path = "data/progress-bot.sqlite3"
