[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-progress-bot"
version = "0.1.0"
description = "Topic-scoped Telegram progress reporting bot"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
progress_bot = ["translations/*.json"]
